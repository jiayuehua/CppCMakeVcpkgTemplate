name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.VERSION }}
      version_number: ${{ steps.get_version.outputs.VERSION_NUMBER }}
    steps:
      - name: Get tag name
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false

  build-and-package:
    name: Build and Package - ${{ matrix.os }}-${{ matrix.compiler }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        configuration: [release]
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: latest

      - name: Restore from cache and setup vcpkg executable and data files
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Run CMake+vcpkg+Ninja to build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-multi-vcpkg-${{ matrix.compiler }}'
          buildPreset: '${{ matrix.compiler }}-${{ matrix.configuration }}'

      - name: Create CPack packages
        run: |
          cd builds/ninja-multi-vcpkg-${{ matrix.compiler }}
          cpack -C Release -G "TGZ;DEB"
        shell: bash

      - name: Upload TGZ package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./builds/ninja-multi-vcpkg-${{ matrix.compiler }}/Tutorial-${{ needs.create-release.outputs.version_number }}-Linux.tar.gz
          asset_name: Tutorial-${{ matrix.compiler }}-${{ needs.create-release.outputs.version }}-Linux.tar.gz
          asset_content_type: application/gzip

      - name: Upload DEB package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./builds/ninja-multi-vcpkg-${{ matrix.compiler }}/Tutorial-${{ needs.create-release.outputs.version_number }}-Linux.deb
          asset_name: Tutorial-${{ matrix.compiler }}-${{ needs.create-release.outputs.version }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package
